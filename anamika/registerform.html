<head>
<title> STUDENT REGISTRATION FORM </title>
</head>
<body bgcolor="pink">
<center>
<h1> STUDENT  REGISTRATION FORM </h1>
<form>
Name:
<input type ="text" name="name">
<br><br>
Email :
<input type="email" name="email">
<br><br>
Password :
<input type= "password" name="password">
<br><br>
Age:
<input type="number" name="age">
<br><br>
Gender:
<input type="radio" name="gender" value="Male">Male
<input type="radio" name="gender" value="Female">Female

<select name="course">
<option>MCA </option>
<option>MBA </option>
<option>M TECH </option>
<option>BCA </option>
</select>
<br><br>
Hobbies :

Reading <input type="checkbox" name="hobby" value="Reading ">

Sports<input type="checkbox" name="hobby"  value="Sports ">

Dance<input type="checkbox" name="hobby" value="Dance">
<br><br>

Address:<textarea name="address" rows="4" cols="10"></textarea>
<br><br>
Date Of Birth
<input type="date" name="dob">
<br><br>
<input type="submit" value="Register">
<input type="reset" value ="Clear">
</form>
</center

</body>
</html>
