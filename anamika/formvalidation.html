
<!DOCTYPE html>
<html>
<head>
    <title>HTML Form</title>
</head>
<body bgcolor="pink">

    <h1>Registration Form</h1>

    <form method="POST" onsubmit="return validation()">
 
        <label> Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">
        <br><br>

        <label>Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">
        <br><br>

        <label>Password:</label>
        <input type="password" id="password" name="password">
        <br><br>

        <label>Phone Number:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        <label >Date of Birth:</label>
        <input type="date" id="dob" name="dob">
        <br><br>
        <label >Address:</label>
       
        <textarea id="address" name="address" rows="4" cols="30"></textarea>
        <br><br>

        <label>Select Course:</label>
        <select id="course" name="course">
            <option value="">Select Course</option>
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="JavaScript">JavaScript</option>
            <option value="Python">Python</option>
        </select>
        <br><br>

       
         <input type="Checkbox" name ="terms">
         I agree to  the terms and condition
           <br><br>
     
     
        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>
<script>
function validation()
{
var name= document.getElementById("name").value;
var email= document.getElementById("email").value;
var password= document.getElementById("password").value;
var phone_number= document.getElementById("phone").value;
var gender= document.getElementsByName("gender");
var dob= document.getElementById("dob").value;
var course= document.getElementById("course").value;
var address= document.getElementById("address").value;
var terms=document.getElementsByName("terms");
var tselect=false;
var gselected=false;
var msg ="";
if(name=="")
{
	msg += "Enter Name \n";
}
if(email=="")
{
 	msg += "Enter your email \n";
}
if(password=="")
{
	msg +="Enter password\n";
}
if(phone_number =="")
{
	msg +="Enter phone number\n";
}
if(dob=="")
{
	msg +="Enter Date of birth\n";
}
if(address=="")
{
	msg +="Enter Address\n";
}
if(course=="")
{
	msg +="Enter Course\n";
}
for(var i=0;i<gender.length;i++)
{
	if (gender[i].checked)
	{
		gselected=true;
	}
}
if (gselected==false)
{
	msg+="Enter your gender";
}
if (terms[0].checked)
{
	tselect=true;
}
if (tselect==false)
{
	msg+="select terms and condition";
}
if(msg!="")
{
	alert(msg)
	return false;
}
else
{
	alert("successful")
	return true;
}
}
</script>
</body>
</html>
